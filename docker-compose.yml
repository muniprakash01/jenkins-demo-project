services:
  web:
    image: ${IMAGE_NAME:-flask-cicd}:${IMAGE_TAG:-latest}
    container_name: flask-cicd-app
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      PORT: "5000"
      APP_ENV: "${APP_ENV:-production}"

    volumes:
      - app-data:/app/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    init: true

volumes:
  app-data:
